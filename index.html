<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VK Photo Tool</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#EBEDF0; color:#000; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; padding-bottom:40px; }
  header { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); position:sticky; top:0; z-index:50; }
  .wrap { max-width:1000px; margin:0 auto; padding:0 16px; }
  .hrow { height:56px; display:flex; justify-content:space-between; align-items:center; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:17px; }
  .logo { width:32px; height:32px; background:#0077FF; border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .ver { font-size:11px; color:#999; font-weight:400; }
  .tabs { display:flex; background:#F0F2F5; border-radius:8px; padding:4px; gap:4px; }
  .tab { border:0; background:transparent; padding:6px 14px; border-radius:6px; font-size:14px; color:#666; cursor:pointer; }
  .tab.active { background:#fff; color:#0077FF; font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  main { margin-top:20px; }
  .card { background:#fff; border-radius:16px; padding:18px; box-shadow:0 1px 2px rgba(0,0,0,.06); margin-bottom:16px; }
  .card h3 { margin:0 0 12px; font-size:15px; }
  .muted { color:#818C99; font-size:13px; margin:4px 0 0; }
  .grid { display:grid; grid-template-columns:1fr; gap:16px; }
  @media (min-width:900px){ .grid { grid-template-columns:4fr 8fr; align-items:start; } }
  .slots { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .slot { height:92px; border:2px dashed #C4C8CC; border-radius:12px; background:#F7F8FA; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; color:#777; font-size:12px; position:relative; overflow:hidden; text-align:center; }
  .slot:hover { border-color:#0077FF; color:#0077FF; }
  .slot.filled { border-style:solid; border-color:#D7DADD; }
  .slot.active { border-color:#0077FF; box-shadow:0 0 0 3px rgba(0,119,255,.15); }
  .slot img { width:100%; height:100%; object-fit:cover; }
  .badge { position:absolute; top:6px; right:6px; background:#0077FF; color:#fff; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; }
  .dropzone { height:180px; border:2px dashed #B3D4FF; border-radius:12px; background:rgba(0,119,255,.05); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; text-align:center; position:relative; overflow:hidden; }
  .dropzone:hover { background:rgba(0,119,255,.1); }
  .dropzone .dz-img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:10px; opacity:.35; }
  .dropzone .dz-text { position:relative; z-index:2; }
  .row { display:flex; align-items:center; gap:10px; }
  .zoomval { font-weight:600; color:#0077FF; min-width:48px; text-align:center; background:#F0F6FF; border-radius:8px; padding:4px; }
  .hint { font-size:12px; color:#666; background:#F0F6FF; border:1px solid #DBE9FF; border-radius:10px; padding:10px; }
  .btn { width:100%; padding:12px; background:#0077FF; color:#fff; border:0; border-radius:12px; font-size:15px; font-weight:500; cursor:pointer; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn:active:not(:disabled) { background:#0066DB; }
  .btn-mini { border:0; background:#F0F2F5; color:#555; font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer; }
  .warn { color:#E64646; font-size:11px; text-align:center; margin-top:8px; font-weight:500; }
  .previewOuter { background:#fff; border-radius:16px; padding:14px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .previewArea { background:#F0F2F5; border:1px solid #E7E8EC; border-radius:12px; padding:8px; min-height:400px; display:flex; align-items:center; justify-content:center;
    background-image: linear-gradient(45deg,#E5E7EB 25%,transparent 25%),linear-gradient(-45deg,#E5E7EB 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#E5E7EB 75%),linear-gradient(-45deg,transparent 75%,#E5E7EB 75%);
    background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; }
  #stage { position:relative; width:100%; touch-action:none; user-select:none; -webkit-user-select:none; }
  #stage img.photo { position:absolute; top:0; left:0; width:100%; transform-origin:top left; z-index:5; }
  #stage img.template { position:relative; width:100%; display:block; pointer-events:none; z-index:10; }
  .placeholder { text-align:center; max-width:300px; background:rgba(255,255,255,.95); border-radius:14px; padding:20px; }
  .link { color:#0077FF; cursor:pointer; background:none; border:0; font-size:14px; padding:0; text-decoration:underline; }
  #errBox { position:fixed; left:0; right:0; bottom:0; background:#D64545; color:#fff; padding:10px 14px; font-size:13px; z-index:100; display:none; white-space:pre-wrap; }
  .disabledCard { opacity:.5; pointer-events:none; }
  .slider { width:100%; accent-color:#0077FF; }
  .headrow { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
</style>
</head>
<body>
<div id="errBox"></div>
<noscript><div style="padding:20px">Для работы приложения нужен включённый JavaScript.</div></noscript>

<header>
  <div class="wrap hrow">
    <div class="brand"><span class="logo">▦</span> VK Photo Tool <span class="ver">v4</span></div>
    <div class="tabs">
      <button class="tab active" id="tabUser" onclick="switchTab('user')">Режим пользователя</button>
      <button class="tab" id="tabAdmin" onclick="switchTab('admin')">Admin</button>
    </div>
  </div>
</header>

<main>
<div class="wrap">

  <section id="viewUser">
    <div class="grid">
      <div>
        <div class="card">
          <h3>1. Загрузите фото (<span id="cntLabel"></span>)</h3>
          <div class="slots" id="slotsGrid"></div>
        </div>

        <div class="card" id="adjustCard">
          <div class="headrow">
            <h3 style="margin:0">2. Настройка фото <span id="adjNum"></span></h3>
            <button class="btn-mini" onclick="resetActive()">Сброс</button>
          </div>
          <div class="row" style="margin-bottom:8px"><span style="font-size:13px">Масштаб</span><span class="zoomval" id="zoomVal">100%</span></div>
          <input type="range" id="zoomSlider" class="slider" min="0.1" max="3" step="0.05" value="1">
          <div class="hint" style="margin-top:12px">Перетаскивайте пальцем или мышью внутри области предпросмотра, чтобы двигать выбранное фото.</div>
        </div>

        <div class="card">
          <h3>3. Готово</h3>
          <button class="btn" id="saveBtn" onclick="exportImage()">Сохранить и скачать</button>
          <div class="warn" id="saveHint"></div>
        </div>
      </div>

      <div class="previewOuter">
        <div class="headrow">
          <h3 style="margin:0">Предпросмотр</h3>
          <span id="editingBadge" style="font-size:12px;color:#0077FF;background:#F0F6FF;padding:3px 8px;border-radius:8px;display:none"></span>
        </div>
        <div class="previewArea">
          <div class="placeholder" id="previewPlaceholder">
            <p style="margin:0 0 4px;color:#666;font-size:14px">Шаблон ещё не задан.</p>
            <p style="margin:0"><button class="link" onclick="switchTab('admin')">Перейти в Admin</button></p>
          </div>
          <div id="stage" style="display:none;cursor:grab"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="viewAdmin" style="display:none">
    <div class="card" style="max-width:560px;margin:0 auto">
      <h3 style="font-size:18px">Настройки администратора</h3>
      <p class="muted" style="margin-bottom:20px">Задайте количество окошек и загрузите шаблон.</p>

      <label style="font-size:13px;font-weight:500;display:block;margin-bottom:8px">Количество фото в шаблоне</label>
      <div class="row" style="margin-bottom:24px">
        <input type="range" id="photoCount" class="slider" min="1" max="5" step="1" value="1">
        <span class="zoomval" id="photoCountVal">1</span>
      </div>

      <label style="font-size:13px;font-weight:500;display:block;margin-bottom:8px">Шаблон (PNG с прозрачностью)</label>
      <label class="dropzone" id="tplDrop">
        <img class="dz-img" id="tplPreviewImg" style="display:none">
        <div class="dz-text" id="tplText">
          <div style="font-size:26px">⬆</div>
          <div style="font-size:14px;font-weight:500;color:#333">Нажмите, чтобы загрузить шаблон</div>
          <div style="font-size:12px;color:#888;margin-top:4px">PNG с прозрачным фоном</div>
        </div>
        <input type="file" accept="image/png" hidden id="tplInput">
      </label>
    </div>
  </section>

</div>
</main>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js" onerror="window.__bridgeFailed=1"></script>
<script>
window.addEventListener('error', function(e){ showErr('Ошибка: ' + e.message); });
function showErr(t){ var b=document.getElementById('errBox'); b.style.display='block'; b.textContent += t + '\n'; }

var tab='user', templateSrc=null, photoCount=1, activeId=0;
var photos=[{id:0,src:null,scale:1,x:0,y:0}];
var photoEls={}, drag=null;

function mk(i){ return {id:i,src:null,scale:1,x:0,y:0}; }
function active(){ for(var i=0;i<photos.length;i++) if(photos[i].id===activeId) return photos[i]; return photos[0]; }

function switchTab(t){
  tab=t;
  document.getElementById('viewUser').style.display = t==='user'?'block':'none';
  document.getElementById('viewAdmin').style.display = t==='admin'?'block':'none';
  document.getElementById('tabUser').className = 'tab'+(t==='user'?' active':'');
  document.getElementById('tabAdmin').className = 'tab'+(t==='admin'?' active':'');
}

document.getElementById('photoCount').addEventListener('input', function(e){
  photoCount=parseInt(e.target.value,10);
  document.getElementById('photoCountVal').textContent=photoCount;
  if(photoCount>photos.length){ for(var i=photos.length;i<photoCount;i++) photos.push(mk(i)); }
  else { photos.splice(photoCount); }
  if(activeId>=photoCount) activeId=0;
  renderSlots(); renderPreview(); updateSaveState();
});

document.getElementById('tplInput').addEventListener('change', function(e){
  var f=e.target.files && e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){ templateSrc=ev.target.result; renderPreview(); updateSaveState();
    var pi=document.getElementById('tplPreviewImg'); pi.src=templateSrc; pi.style.display='block';
    document.getElementById('tplText').style.display='none';
  };
  r.readAsDataURL(f);
});

function uploadPhoto(e,id){
  var f=e.target.files && e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(ev){
    for(var i=0;i<photos.length;i++) if(photos[i].id===id){ photos[i]={id:id,src:ev.target.result,scale:1,x:0,y:0}; }
    activeId=id; renderSlots(); renderPreview(); updateAdjust(); updateSaveState();
  };
  r.readAsDataURL(f);
}

function setActive(id){ activeId=id; renderSlots(); renderPreview(); updateAdjust(); }

function resetActive(){ var p=active(); if(!p) return; p.scale=1;p.x=0;p.y=0; applyT(p); updateAdjust(); }

function applyT(p){ var img=photoEls[p.id]; if(img) img.style.transform='translate('+p.x+'px,'+p.y+'px) scale('+p.scale+')'; }

function renderSlots(){
  var g=document.getElementById('slotsGrid'); g.innerHTML='';
  photos.forEach(function(p,idx){
    var label=document.createElement('label');
    label.className='slot'+(p.src?' filled':'')+((p.src&&p.id===activeId)?' active':'');
    if(p.src){
      var im=document.createElement('img'); im.src=p.src; label.appendChild(im);
      if(p.id===activeId){ var b=document.createElement('span'); b.className='badge'; b.textContent='Выбрано'; label.appendChild(b); }
      label.addEventListener('click', function(ev){ ev.preventDefault(); setActive(p.id); });
    } else {
      var d=document.createElement('div');
      d.innerHTML='<div style="font-size:18px">⬆</div><div>Слот '+(idx+1)+'</div>';
      label.appendChild(d);
      var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.hidden=true;
      inp.addEventListener('change', function(ev){ uploadPhoto(ev,p.id); });
      label.appendChild(inp);
    }
    g.appendChild(label);
  });
  document.getElementById('cntLabel').textContent = photos.filter(function(p){return p.src;}).length + ' из ' + photoCount;
}

function renderPreview(){
  var ph=document.getElementById('previewPlaceholder'), st=document.getElementById('stage');
  if(!templateSrc){ ph.style.display='flex'; st.style.display='none'; return; }
  ph.style.display='none'; st.style.display='block';
  var tpl=document.getElementById('tplImg');
  if(!tpl){ tpl=document.createElement('img'); tpl.id='tplImg'; tpl.className='template'; tpl.draggable=false; st.appendChild(tpl); }
  tpl.src=templateSrc;
  st.querySelectorAll('img.photo').forEach(function(el){ el.remove(); });
  photoEls={};
  photos.forEach(function(p){
    if(!p.src) return;
    var img=document.createElement('img'); img.className='photo'; img.draggable=false; img.src=p.src;
    applyT(p); img.style.transform='translate('+p.x+'px,'+p.y+'px) scale('+p.scale+')';
    st.appendChild(img); photoEls[p.id]=img;
  });
}

function updateAdjust(){
  var p=active(), card=document.getElementById('adjustCard'), s=document.getElementById('zoomSlider'), v=document.getElementById('zoomVal');
  document.getElementById('adjNum').textContent = p ? (p.id+1) : '';
  if(!p||!p.src){ card.classList.add('disabledCard'); return; }
  card.classList.remove('disabledCard');
  s.value=p.scale; v.textContent=Math.round(p.scale*100)+'%';
  var eb=document.getElementById('editingBadge');
  eb.style.display='inline-block'; eb.textContent='Редактируется фото '+(p.id+1);
}

document.getElementById('zoomSlider').addEventListener('input', function(e){
  var p=active(); if(!p) return;
  p.scale=parseFloat(e.target.value); applyT(p);
  document.getElementById('zoomVal').textContent=Math.round(p.scale*100)+'%';
});

var stage=document.getElementById('stage');
stage.addEventListener('pointerdown', function(e){
  var p=active(); if(!p||!p.src) return;
  drag={sx:e.clientX, sy:e.clientY, ox:p.x, oy:p.y};
  e.preventDefault();
});
window.addEventListener('pointermove', function(e){
  if(!drag) return;
  var p=active(); if(!p) return;
  p.x=drag.ox+(e.clientX-drag.sx); p.y=drag.oy+(e.clientY-drag.sy);
  applyT(p);
});
window.addEventListener('pointerup', function(){ drag=null; });
window.addEventListener('pointercancel', function(){ drag=null; });

function allUploaded(){ for(var i=0;i<photos.length;i++) if(!photos[i].src) return false; return true; }

function updateSaveState(){
  var ok = !!templateSrc && allUploaded();
  document.getElementById('saveBtn').disabled = !ok;
  document.getElementById('saveHint').textContent = ok ? '' : (!templateSrc ? 'Сначала загрузите шаблон в разделе Admin.' : 'Загрузите все '+photoCount+' фото.');
}

function loadImg(src){
  return new Promise(function(res,rej){
    var im=new Image();
    im.onload=function(){res(im);}; im.onerror=function(){rej(new Error('не удалось загрузить изображение'));};
    im.src=src;
  });
}

function triggerDownload(dataUrl){
  var done=false;
  try{
    if(window.vkBridge && window.vkBridge.isEmbedded && window.vkBridge.isEmbedded()){
      window.vkBridge.send('VKWebAppDownloadFile',{url:dataUrl,filename:'vk-merged-photo.png'}).then(function(){done=true;}).catch(function(){});
      return;
    }
  }catch(e){}
  var a=document.createElement('a'); a.href=dataUrl; a.download='vk-merged-photo.png';
  document.body.appendChild(a); a.click(); a.remove();
}

async function exportImage(){
  if(!templateSrc) return;
  try{
    var tplImg=await loadImg(templateSrc);
    var canvas=document.createElement('canvas');
    canvas.width=tplImg.naturalWidth; canvas.height=tplImg.naturalHeight;
    var ctx=canvas.getContext('2d');
    var mult=canvas.width / stage.offsetWidth;
    for(var i=0;i<photos.length;i++){
      var p=photos[i]; if(!p.src) continue;
      var im=await loadImg(p.src);
      var w=canvas.width*p.scale, h=w*im.naturalHeight/im.naturalWidth;
      ctx.drawImage(im, p.x*mult, p.y*mult, w, h);
    }
    ctx.drawImage(tplImg,0,0,canvas.width,canvas.height);
    triggerDownload(canvas.toDataURL('image/png',1.0));
  }catch(err){ showErr('Ошибка при сохранении: '+err.message); }
}

renderSlots(); renderPreview(); updateAdjust(); updateSaveState();
window.addEventListener('load', function(){
  try{ if(window.vkBridge){ window.vkBridge.send('VKWebAppInit').catch(function(){}); } }catch(e){}
});
</script>
</body>
</html>
