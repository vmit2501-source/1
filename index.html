<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VK Photo Tool Бумеранг</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#EBEDF0; color:#000; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; padding-bottom:40px; }
    header { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); position:sticky; top:0; z-index:50; }
    .wrap { max-width:1000px; margin:0 auto; padding:0 16px; }
    .hrow { height:56px; display:flex; justify-content:space-between; align-items:center; }
    .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:17px; }
    .logo { width:32px; height:32px; background:#FF3347; border-radius:8px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
    .tabs { display:flex; background:#F0F2F5; border-radius:8px; padding:4px; gap:4px; }
    .tab { border:0; background:transparent; padding:6px 14px; border-radius:6px; font-size:14px; color:#666; cursor:pointer; }
    .tab.active { background:#fff; color:#0077FF; font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.12); }
    main { margin-top:20px; }
    .card { background:#fff; border-radius:16px; padding:18px; box-shadow:0 1px 2px rgba(0,0,0,.06); margin-bottom:16px; }
    .card h3 { margin:0 0 12px; font-size:15px; }
    .muted { color:#818C99; font-size:13px; margin:4px 0 0; }
    .grid { display:grid; grid-template-columns:1fr; gap:16px; }
    @media (min-width:900px){ .grid { grid-template-columns:4fr 8fr; align-items:start; } }
    .slots { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .slot { height:92px; border:2px dashed #C4C8CC; border-radius:12px; background:#F7F8FA; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; color:#777; font-size:12px; position:relative; overflow:hidden; text-align:center; }
    .slot:hover { border-color:#0077FF; color:#0077FF; }
    .slot.filled { border-style:solid; border-color:#D7DADD; }
    .slot.active { border-color:#0077FF; box-shadow:0 0 0 3px rgba(0,119,255,.15); }
    .slot img { width:100%; height:100%; object-fit:cover; }
    .badge { position:absolute; top:6px; right:6px; background:#0077FF; color:#fff; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; }
    .dropzone { border:2px dashed #B3D4FF; border-radius:12px; background:rgba(0,119,255,.05); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; text-align:center; position:relative; overflow:hidden; }
    .dropzone:hover { background:rgba(0,119,255,.1); }
    .dropzone .dz-img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:10px; opacity:.35; }
    .dropzone .dz-text { position:relative; z-index:2; padding: 20px; }
    .row { display:flex; align-items:center; gap:10px; }
    .zoomval { font-weight:600; color:#0077FF; min-width:48px; text-align:center; background:#F0F6FF; border-radius:8px; padding:4px; }
    .hint { font-size:12px; color:#666; background:#F0F6FF; border:1px solid #DBE9FF; border-radius:10px; padding:10px; }
    .btn { width:100%; padding:12px; background:#0077FF; color:#fff; border:0; border-radius:12px; font-size:15px; font-weight:500; cursor:pointer; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn:active:not(:disabled) { background:#0066DB; }
    .btn-mini { border:0; background:#F0F2F5; color:#555; font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer; }
    .warn { color:#E64646; font-size:11px; text-align:center; margin-top:8px; font-weight:500; }
    .previewOuter { background:#fff; border-radius:16px; padding:14px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
    .previewArea { background:#F0F2F5; border:1px solid #E7E8EC; border-radius:12px; padding:8px; min-height:400px; display:flex; align-items:center; justify-content:center;
      background-image: linear-gradient(45deg,#E5E7EB 25%,transparent 25%),linear-gradient(-45deg,#E5E7EB 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#E5E7EB 75%),linear-gradient(-45deg,transparent 75%,#E5E7EB 75%);
      background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; overflow:hidden;}
    .disabledCard { opacity:.5; pointer-events:none; }
    .slider { width:100%; accent-color:#0077FF; }
    .headrow { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    #errBox { position:fixed; left:0; right:0; bottom:0; background:#D64545; color:#fff; padding:10px 14px; font-size:13px; z-index:100; white-space:pre-wrap; }
  </style>
  
  <!-- Подключение React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Подключение Babel для понимания синтаксиса JSX -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Подключение VK Bridge -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const bridge = window.vkBridge;

    function App() {
      const [tab, setTab] = useState('user');
      
      const [adminTemplates, setAdminTemplates] = useState([]);
      const [stagingSrc, setStagingSrc] = useState(null);
      const [stagingCount, setStagingCount] = useState(1);

      const [userTemplate, setUserTemplate] = useState(null);
      const [photos, setPhotos] = useState([]);
      const [activeId, setActiveId] = useState(0);
      const [error, setError] = useState('');
      
      const stageRef = useRef(null);
      const dragRef = useRef(null);

      useEffect(() => {
        if (bridge) bridge.send('VKWebAppInit').catch(() => {});
      }, []);

      const handleStagingUpload = (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (ev) => setStagingSrc(ev.target.result);
        r.readAsDataURL(f);
      };

      const saveTemplateToGallery = () => {
        if (!stagingSrc) return;
        setAdminTemplates(prev => [...prev, { id: Date.now(), src: stagingSrc, slots: stagingCount }]);
        setStagingSrc(null);
        setStagingCount(1);
      };

      const removeTemplate = (id) => {
        setAdminTemplates(prev => prev.filter(t => t.id !== id));
        if (userTemplate?.id === id) {
          setUserTemplate(null);
          setPhotos([]);
        }
      };

      const selectUserTemplate = (tpl) => {
        setUserTemplate(tpl);
        setPhotos(Array.from({ length: tpl.slots }).map((_, i) => ({
          id: i, src: null, scale: 1, rotation: 0, x: 0, y: 0, zIndex: i
        })));
        setActiveId(0);
      };

      const activePhoto = photos.find(p => p.id === activeId) || null;

      const updateActive = (changes) => {
        setPhotos(prev => prev.map(p => p.id === activeId ? { ...p, ...changes } : p));
      };

      const uploadPhoto = (e, id) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (ev) => {
          setPhotos(prev => prev.map(p => p.id === id ? { ...p, src: ev.target.result } : p));
          setActiveId(id);
        };
        r.readAsDataURL(f);
      };

      const moveForward = () => {
        setPhotos(prev => {
          const curr = prev.find(p => p.id === activeId);
          const next = prev.filter(p => p.zIndex > curr.zIndex).sort((a, b) => a.zIndex - b.zIndex)[0];
          if (!next) return prev;
          return prev.map(p => {
            if (p.id === curr.id) return { ...p, zIndex: next.zIndex };
            if (p.id === next.id) return { ...p, zIndex: curr.zIndex };
            return p;
          });
        });
      };

      const moveBackward = () => {
        setPhotos(prev => {
          const curr = prev.find(p => p.id === activeId);
          const prevEl = prev.filter(p => p.zIndex < curr.zIndex).sort((a, b) => b.zIndex - a.zIndex)[0];
          if (!prevEl) return prev;
          return prev.map(p => {
            if (p.id === curr.id) return { ...p, zIndex: prevEl.zIndex };
            if (p.id === prevEl.id) return { ...p, zIndex: curr.zIndex };
            return p;
          });
        });
      };

      const handlePointerDown = (e) => {
        if (!activePhoto || !activePhoto.src) return;
        dragRef.current = { sx: e.clientX, sy: e.clientY, ox: activePhoto.x, oy: activePhoto.y };
      };

      useEffect(() => {
        const handlePointerMove = (e) => {
          if (!dragRef.current) return;
          const dx = e.clientX - dragRef.current.sx;
          const dy = e.clientY - dragRef.current.sy;
          setPhotos(prev => prev.map(p => p.id === activeId ? { ...p, x: dragRef.current.ox + dx, y: dragRef.current.oy + dy } : p));
        };
        
        const stopDrag = () => { dragRef.current = null; };

        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', stopDrag);
        window.addEventListener('pointercancel', stopDrag);

        return () => {
          window.removeEventListener('pointermove', handlePointerMove);
          window.removeEventListener('pointerup', stopDrag);
          window.removeEventListener('pointercancel', stopDrag);
        };
      }, [activeId]);

      const exportImage = async () => {
        if (!userTemplate) return;
        try {
          const loadImg = (src) => new Promise((res, rej) => {
            const im = new Image();
            im.onload = () => res(im);
            im.onerror = () => rej(new Error('Не удалось загрузить изображение'));
            im.src = src;
          });

          const tplImg = await loadImg(userTemplate.src);
          const canvas = document.createElement('canvas');
          canvas.width = tplImg.naturalWidth; 
          canvas.height = tplImg.naturalHeight;
          const ctx = canvas.getContext('2d');
          const stageWidth = stageRef.current.offsetWidth;
          const mult = canvas.width / stageWidth;

          const sortedPhotos = [...photos].sort((a, b) => a.zIndex - b.zIndex);
          
          for (let i = 0; i < sortedPhotos.length; i++) {
            const p = sortedPhotos[i];
            if (!p.src) continue;
            const im = await loadImg(p.src);
            
            ctx.save();
            ctx.translate(p.x * mult, p.y * mult);
            ctx.scale(p.scale, p.scale);
            ctx.rotate(p.rotation * Math.PI / 180);
            
            const baseW = canvas.width;
            const baseH = baseW * (im.naturalHeight / im.naturalWidth);
            
            ctx.drawImage(im, 0, 0, baseW, baseH);
            ctx.restore();
          }
          
          ctx.drawImage(tplImg, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/png', 1.0);

          try {
            if (bridge && bridge.isEmbedded && bridge.isEmbedded()) {
              await bridge.send('VKWebAppDownloadFile', { url: dataUrl, filename: 'bumerang-photo.png' });
              return;
            }
          } catch (e) {}

          const a = document.createElement('a');
          a.href = dataUrl;
          a.download = 'bumerang-photo.png';
          document.body.appendChild(a);
